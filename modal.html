<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modal</title>
    <style>
        .button{
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .backdrop{

            display: flex;
            align-items: center;
            justify-content: center;

            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            z-index: 999;

            pointer-events:none;
            opacity: 0;
            visibility: hidden;

        }

        .modal{
            padding: 24px;
            border-radius: 4px;
            max-width: 640px;
            width: 100%;
            min-height: 320px;
        }

        body.show-modal .backdrop{
            opacity: 1;
            visibility: visible;
            pointer-events: initial;
        }
    </style>
</head>
<body>

   <button type="button" class="button" data-action="open-modal">
    Open button</button> 

    <div class="backdrop js-backdrop">
        <div class="modal">
            <h2>Modal</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nostrum, provident.
            </p>
            <button type="button" class="button" data-action="close-modal">Close</button>
        </div>
    </div>

    <script type="module" src="./js/modal.js"></script>
    
</body>
</html>
